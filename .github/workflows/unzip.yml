name: Unzip map tiles V2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove old tiles
        run: |
          rm -rf 12 13 14 15 16 17

      - name: Extract V2 tiles
        run: |
          unzip -o orignal_v2_xyz_github.zip -d .

      - name: Commit V2 tiles
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Install iHunter V2 map tiles" || exit 0
          git push
